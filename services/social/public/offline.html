<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172a23">
    <link rel="icon" href="/img/mochirii-icon.png" type="image/png">
    <title>Mōchirīī Social is offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); display: grid; place-items: center; box-sizing: border-box; background: #101c19; color: #f5f0df; }
      main { width: min(32rem, 100%); padding: 2rem; text-align: center; border: 1px solid #6f846f; border-radius: 1.25rem; background: #172a23; box-sizing: border-box; }
      img { width: 5rem; height: 5rem; object-fit: contain; }
      h1 { margin: 1rem 0 .5rem; font-size: clamp(1.5rem, 5vw, 2.25rem); }
      p { line-height: 1.6; }
      button { min-width: 44px; min-height: 44px; padding: .75rem 1.25rem; border: 1px solid #d9c786; border-radius: 999px; background: #d9c786; color: #101c19; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f5f0df; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/mochirii-icon.png" alt="Mōchirīī emblem" width="80" height="80">
      <h1>Mōchirīī Social is offline</h1>
      <p>Reconnect to continue to the private guild social space.</p>
      <button type="button">Try again</button>
    </main>
    <script>
      const reload = () => window.location.reload();
      document.querySelector("button").addEventListener("click", reload);
      window.addEventListener("online", reload);
    </script>
  </body>
</html>
